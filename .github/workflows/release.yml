name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win
          - name: macOS x64 and Apple Silicon
            os: macos-15
            target: mac
          - name: Linux x64
            os: ubuntu-latest
            target: linux

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Electron app
        shell: bash
        env:
          NULLNOTE_VERSION: ${{ github.ref_name }}
        run: |
          export NULLNOTE_VERSION="${NULLNOTE_VERSION#v}"
          bash electron/build.sh "${{ matrix.target }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: electron-release/packages/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and attach downloads
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
